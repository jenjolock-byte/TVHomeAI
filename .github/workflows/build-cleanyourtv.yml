name: Build CleanYourTV minimal-permission APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-cleanyourtv.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TVHomeAI workflow
        uses: actions/checkout@v4

      - name: Checkout CleanYourTV upstream source
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: main
          path: upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply minimal-permission profile
        working-directory: upstream/launcher
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p = "app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ET.register_namespace("tools", "http://schemas.android.com/tools")
          tree = ET.parse(p)
          root = tree.getroot()
          A = "{http://schemas.android.com/apk/res/android}"
          for node in list(root):
              if node.tag == "uses-permission" and node.get(A+"name") == "android.permission.ACCESS_FINE_LOCATION":
                  root.remove(node)
              if node.tag == "application":
                  for child in list(node):
                      if child.tag == "service" and child.get(A+"name") in (".HomeKeyService", ".InputKeyService"):
                          node.remove(child)
          tree.write(p, encoding="utf-8", xml_declaration=True)
          print("Removed fine-location permission and optional accessibility services from this build.")
          PY

      - name: Build release APK and run tests
        working-directory: upstream/launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean test assembleRelease

      - name: Upload APK and test reports
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-minimal-permission-release
          path: |
            upstream/launcher/app/build/outputs/apk/release/*.apk
            upstream/launcher/app/build/reports/tests/
          if-no-files-found: error
          retention-days: 14
